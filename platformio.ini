[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  fastled/FastLED
  adafruit/Adafruit MPU6050
  adafruit/Adafruit Unified Sensor
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DPOV_DEBUG_SERIAL=1
  ; Modul-Unterordner: Header per Basisname auffindbar (kein #include-Pfad noetig)
  -I src/core
  -I src/sensor
  -I src/render
  -I src/store
  -I src/web
